name: lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "dev or vault"
        default: "dev"
      candidate:
        description: "candidate name (vault mode only), e.g. M2"
        default: ""
      probe:
        description: "run the funding-rate data probe (true/false)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: lab
  cancel-in-progress: false

jobs:
  lab:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Funding data probe
        if: github.event.inputs.probe == 'true'
        continue-on-error: true
        run: python probe_funding.py

      - name: Run lab
        env:
          EXCHANGE: okx
        run: python lab.py ${{ github.event.inputs.mode }} --candidate "${{ github.event.inputs.candidate }}"

      - name: Save results
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          git add data/lab_dev_result.txt data/lab_vault_result.txt data/lab_log.json data/funding_probe.txt 2>/dev/null || true
          git diff --cached --quiet || (git commit -q -m "lab result" && git pull --rebase -q && git push)
