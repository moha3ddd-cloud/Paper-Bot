name: research2

on:
  workflow_dispatch:
    inputs:
      days:
        description: "History length in days"
        default: "1800"

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run research
        env:
          EXCHANGE: okx
          DAYS: ${{ github.event.inputs.days }}
        run: python research2.py 2>&1 | tee research2_log.txt

      - name: Save result
        if: always()
        run: |
          git config user.name "paper-bot"
          git config user.email "paper-bot@users.noreply.github.com"
          mkdir -p data
          [ -f data/research2_result.txt ] || tail -n 40 research2_log.txt > data/research2_result.txt
          git add data/research2_result.txt
          git diff --cached --quiet || (git commit -q -m "research2 result" && git pull --rebase -q && git push)
